<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} · 动画讲解</title>
<style>
{{FONT_FACES}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;cursor:default}
#scenes{position:absolute;inset:0}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;will-change:opacity,transform;transform-origin:960px 540px;overflow:visible}
#fx{position:absolute;inset:0;pointer-events:none}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#chapTag{position:absolute;left:64px;top:44px;display:flex;align-items:center;gap:18px;opacity:0;transition:none}
.fact{position:absolute;opacity:0;will-change:transform,opacity}
/* subtitles */
#subs{position:absolute;left:0;right:0;bottom:0;height:200px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:52px;pointer-events:none;transition:opacity .4s,transform .35s}
#subs.off{opacity:0}
body.uishow #subs{transform:translateY(-96px)}
#subLine{font-size:46px;font-weight:700;letter-spacing:3px;white-space:nowrap;opacity:0}
#subLine span{transition:color .12s}
/* start overlay */
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;transition:opacity .9s}
#start.hide{opacity:0;pointer-events:none}
.st-inner{text-align:center}
.st-title img{width:96px;height:96px;vertical-align:middle;margin-left:18px;transform:rotate(-6deg) translateY(-10px)}
#startBtn:disabled .ring{display:none}
/* watermark (script.json "watermark"): bottom-right corner, under the controls; snap.sh flags overlaps */
#wm{position:absolute;right:40px;bottom:22px;z-index:6;font-family:"NSans",sans-serif;font-size:24px;font-weight:700;letter-spacing:4px;color:rgba(90,90,90,.5);pointer-events:none;white-space:nowrap}
#wm:empty{display:none}
#endCard{position:absolute;left:0;right:0;bottom:200px;display:flex;justify-content:center;opacity:0;pointer-events:none;transition:opacity .8s;z-index:4}
#endCard.show{opacity:1;pointer-events:auto}
/* controls */
#ui{position:absolute;left:0;right:0;bottom:0;padding:18px 26px 14px;background:linear-gradient(to top,rgba(10,8,6,.85),rgba(10,8,6,0));color:#eadfc6;font-size:15px;transition:opacity .35s;z-index:10;opacity:0;pointer-events:none}
#ui.show{opacity:1;pointer-events:auto}
#bar{position:relative;height:22px;cursor:pointer;margin-bottom:6px}
#bar::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;background:rgba(255,255,255,.18);border-radius:2px}
#barFill{position:absolute;left:0;top:9px;height:4px;width:0;border-radius:2px}
#barBuf{display:none}
#knob{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%}
#marks .mk{position:absolute;top:5px;width:2px;height:12px;opacity:.8}
#marks .mk span{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;opacity:0;transition:opacity .2s;background:rgba(20,15,10,.8);padding:2px 8px;border-radius:3px}
#bar:hover #marks .mk span{opacity:1}
#barHover{position:absolute;bottom:24px;transform:translateX(-50%);background:rgba(20,15,10,.9);padding:3px 8px;border-radius:3px;font-size:13px;display:none;white-space:nowrap}
#btns{display:flex;align-items:center;gap:10px}
#btns button{background:none;border:1px solid rgba(234,223,198,.25);color:#eadfc6;font-family:inherit;font-size:16px;padding:6px 12px;border-radius:6px;cursor:pointer;min-width:42px}
#btns button:hover{background:rgba(234,223,198,.12)}
#time{font-variant-numeric:tabular-nums;margin-left:8px;opacity:.9}
#curChap{margin-left:14px;letter-spacing:2px}
.sp{flex:1}
#chapMenuWrap{position:relative}
#chapMenu{position:absolute;bottom:42px;right:0;background:rgba(22,17,12,.96);border-radius:8px;padding:8px;display:none;min-width:250px}
#chapMenu.open{display:block}
#chapMenu div{padding:9px 14px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;gap:20px;font-size:17px}
#chapMenu div small{opacity:.6;font-variant-numeric:tabular-nums}
/* ===== theme ===== */
{{THEME_CSS}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="scenes"></div>
    <canvas id="fx" width="1920" height="1080"></canvas>
    <div id="hud">
      <div id="chapTag"><span class="seal" id="chapNum"></span><span class="ct-title" id="chapTitle"></span><span class="ct-sub" id="chapSub"></span></div>
      <div id="facts"></div>
    </div>
    <div id="subs"><div id="subLine"></div></div>
    <div id="start">
      <div class="st-inner">
        <div class="st-kicker">{{KICKER}}</div>
        <h1 class="st-title">{{TITLE}}</h1>
        <div class="st-sub">{{SUBTITLE}}</div>
        <button id="startBtn" disabled><span class="ring"></span><span class="ring r2"></span><span class="lbl" id="startLbl">载入中…</span></button>
        <div class="st-tips">约 {{DURATION}} · 建议开启声音并全屏观看<br>空格 播放/暂停 · ← → 快退/快进 · F 全屏 · C 字幕</div>
      </div>
    </div>
    <div id="wm">{{WATERMARK}}</div>
    <div id="endCard"><button id="replayBtn">↺ 重新播放</button></div>
  </div>
  <div id="ui">
    <div id="bar"><div id="barBuf"></div><div id="barFill"></div><div id="marks"></div><div id="barHover"></div><div id="knob"></div></div>
    <div id="btns">
      <button id="bPlay" title="播放/暂停 (空格)">▶</button>
      <button id="bPrev" title="上一章">⏮</button>
      <button id="bNext" title="下一章">⏭</button>
      <span id="time">0:00 / 0:00</span>
      <span id="curChap"></span>
      <span class="sp"></span>
      <div id="chapMenuWrap"><button id="bMenu" title="章节">章节 ▾</button><div id="chapMenu"></div></div>
      <button id="bSub" class="on" title="字幕 (C)">字幕</button>
      <button id="bMus" class="on" title="背景音乐 (M)">配乐</button>
      <button id="bFs" title="全屏 (F)">⛶</button>
    </div>
  </div>
</div>
<svg id="defs" width="0" height="0" style="position:absolute"><defs></defs></svg>
<script>
{{SCRIPT}}
</script>
</body>
</html>
